```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ToDo List</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="todo-box">

            <h1>My ToDo List</h1>
            <p class="subtitle">Keep track of your tasks</p>

            <div class="input-box">
                <input type="text" id="todo-input" placeholder="Write a new task...">
                <button id="add-btn">Add</button>
            </div>

            <div class="buttons">
                <button id="clear-completed">Clear Completed</button>
                <button id="clear-all">Clear All</button>
            </div>

            <ul id="todo-list"></ul>

            <div class="footer">
                <span id="count">0 tasks</span>
                <span>Double click a task to edit it</span>
            </div>

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
```
